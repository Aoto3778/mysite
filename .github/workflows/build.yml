name: Build APK

on:
  push:
    branches: [ kakeibo ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ランナーにプリインストール済みの Android SDK を使う。
      # 不足分があれば取得（無くても Gradle が自動取得するので失敗は無視）。
      - name: Ensure Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true

      - name: Run unit tests and build release APK
        run: ./gradlew test assembleRelease --stacktrace --no-daemon

      - name: Stage APK
        run: cp app/build/outputs/apk/release/app-release.apk kakeibo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kakeibo-apk
          path: kakeibo.apk

      # Release 公開には「Workflow permissions: Read and write」が必要。
      # 未設定でもビルド成果物(Artifact)は上に残るよう、ここは失敗を無視する。
      - name: Publish to Release (tag latest)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest --title "家計簿アプリ（最新ビルド）" \
            --notes "スマホのブラウザでこの kakeibo.apk をダウンロードしてインストールしてください。" \
            kakeibo.apk \
          || gh release upload latest kakeibo.apk --clobber
