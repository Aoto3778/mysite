name: Build APK

on:
  push:
    branches: [ kakeibo ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests and build release APK
        run: gradle test assembleRelease --stacktrace --no-daemon

      - name: Copy APK
        run: cp app/build/outputs/apk/release/app-release.apk kakeibo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kakeibo-apk
          path: kakeibo.apk

      - name: Publish to Release (tag: latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 家計簿アプリ（最新ビルド）
          body: |
            iD / Vpass の決済通知を自動で記録する家計簿アプリ（個人用）。
            スマホのブラウザでこのページの **kakeibo.apk** をダウンロードしてインストールしてください。
          files: kakeibo.apk
